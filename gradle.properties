# Como este build usa a máquina. Não existia: o Gradle rodava com todos os defaults
# conservadores -- um módulo de cada vez, sem cache, e todos os testes de um módulo numa
# JVM só -- num host de 24 núcleos onde o provisionamento leva ~12 minutos.
#
# O container `init` NÃO estava limitado: `cpu.max` é `max` e `cpuset` é 0-23. O gargalo
# sempre foi este arquivo estar ausente, não o Docker.

# Compila e testa módulos independentes ao mesmo tempo. :packages:core é dependência dos
# outros dois, mas module-paper e module-velocity não se conhecem e podem correr juntos.
org.gradle.parallel=true

# Reaproveita saídas de tarefas cujas entradas não mudaram, inclusive entre builds. É o que
# faz um provisionamento que só mexeu em scripts/ não recompilar Java nenhum.
org.gradle.caching=true

# O daemon: o teto real de trabalho paralelo do Gradle. Sem isto ele fica no default de 512m
# e passa o build inteiro coletando lixo em vez de compilar. 2g é folgado para este projeto
# e deixa espaço para os forks de teste abaixo dentro do mem_limit de 6g do `init`.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

# org.gradle.workers.max fica DE FORA de propósito: sem valor o Gradle usa o número de
# processadores visíveis, que dentro do container são os 24 do host. Fixar um número aqui
# só serviria para ficar errado quando a máquina mudar.

# Configuration cache: pula a fase de configuração inteira (avaliar os 4 build.gradle.kts,
# resolver plugins, registrar tasks) em builds subsequentes com os MESMOS argumentos/inputs,
# reidratando o grafo de tasks de um cache serializado em vez de reexecutar o script Kotlin.
# Só habilitado depois de auditar build.gradle.kts por efeitos colaterais de configuração e
# capturas de `project`/`Task.project` em doLast (ver o objeto SexidiumBuildUtil e os
# comentários "configuration cache" nesse arquivo) -- sem essa auditoria isto teria falhado a
# build ou, pior, produzido um build/jar incorreto a partir de um cache inválido.
org.gradle.configuration-cache=true

# org.gradle.vfs.watch NÃO foi adicionado aqui de propósito, apesar de o Gradle recomendá-lo
# para builds repetidos. O ganho do watch é evitar rescanear o filesystem numa SEGUNDA build
# do MESMO daemon vivo -- e o container `init` nunca chega a uma segunda build: ele roda um
# `./gradlew` só e sai (ver docker/node-entry.sh e o comentário em scripts/lib/sexidium.sh
# sobre SX_GRADLE_NO_DAEMON). Pagar para montar watchers de filesystem só para o processo
# morrer em seguida é custo sem benefício aqui. Fora do container, em Linux o watch já vem
# ligado por padrão desde o Gradle 7 -- declarar explicitamente não mudaria nada nesse caso
# também. Se o outro agente mudar a topologia do container `init` para reaproveitar um daemon
# entre deploys (ver mensagem no relatório final), isto vale reconsiderar.
