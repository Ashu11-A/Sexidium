# Quais Minecraft esta build ATENDE, e quantas vezes cada um já recebeu uma atualização.
#
# NOME DO ARTEFATO:  sexidium-paper-<versão>+<contador>.jar   (ex.: sexidium-paper-26.2+15.jar)
#
# UMA COMPILAÇÃO, VÁRIOS NOMES — e isso é a arquitetura, não um atalho.
#
# O jar é compilado UMA vez, contra o `paper-api` da PRIMEIRA versão da lista (o piso), e
# publicado sob um nome por versão atendida. Os bytes são idênticos de propósito:
#
#   * O Paper aceita um plugin cujo `api-version` seja MENOR OU IGUAL ao do servidor e recusa
#     um MAIOR. Compilar contra 26.2 produziria um jar que NÃO CARREGA em 26.1.2 -- o oposto
#     do que "atender as duas" quer dizer. O piso é o que dá compatibilidade para cima.
#   * O código já é multi-versão em tempo de execução, e isso está provado: `buildLoginPacket`
#     preenche o pacote de login pelo NOME de cada record component (26.1.2 tem 11, a 26.2 tem
#     12 -- ela acrescentou `onlineMode`), e `PackFormats.of()` mapeia 26.1->84, 26.2->88.
#     Nenhuma chamada diverge entre as versões, então uma segunda compilação produziria um jar
#     que se comporta exatamente igual e só perde compatibilidade.
#
# Por isso NÃO existe um `api-version` por artefato: os dois nomes carregam o mesmo
# `plugin.yml`, com o piso. Trocar isso por artefato quebraria o de baixo.
#
# O CONTADOR é por versão e conta ATUALIZAÇÕES DAQUELA VERSÃO -- é o `+N` do nome. Suba o
# número da versão que você está atualizando, no MESMO commit que muda o código. Uma versão
# nova entra com `=1`, e o contador dela é dela: não herda o da anterior.
#
# NÃO CONFUNDIR com o `b0033-ea993650eba3` do `SX-READY`: aquele é o id do build store no host
# de deploy, global e atribuído na PUBLICAÇÃO. Este aqui identifica o ARTEFATO e vem do fonte.

# Ordem importa: a PRIMEIRA é o piso -- a versão contra a qual se compila e a que vai no
# `api-version` do plugin.yml. Manter em ordem crescente.
sexidium.minecraft.supported=26.1.2,26.2

# 16: o artefato passou a se chamar sexidium-paper-<versão>+<contador>.jar (nome canônico
# derivado daqui por sexidium::paper_jar_name e pelo build Gradle) -- uma atualização para
# as duas versões atendidas, então as duas sobem juntas.
sexidium.minecraft.26.1.2.build=16
sexidium.minecraft.26.2.build=16
