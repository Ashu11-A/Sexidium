experience.ended=<light_purple><bold>EXPERIENCE</bold></light_purple> <gray>ended.</gray>
experience.joined=<green><player></green> <gray>joined the experience.</gray>
experience.delete.working=<yellow>Deleting this world…</yellow> <gray>Asking the server that holds it.</gray>
experience.delete.done=<green>Experience deleted.</green> <gray>The world and everything that named it are gone.</gray>
experience.delete.queued=<yellow>Delete requested.</yellow> <gray>The server holding this world is not answering right now — it will be deleted as soon as it is back.</gray>
experience.delete.refused=<red>This world could not be deleted right now.</red> <gray>Nothing was removed.</gray>
experience.delete.busy=<gray>Somebody may still be inside it — once they leave, try again.</gray>
experience.delete.unplaced=<gray>No server is holding this world yet, so there is nobody to ask. Enter it once, then delete it.</gray>
experience.delete.not-owner=<red>You do not own that experience.</red>
experience.backup.working=<yellow>Taking a copy of this world…</yellow> <gray>Asking the server that holds it. A big map can take a moment — you do not have to wait here.</gray>
experience.backup.done=<green>Backup created.</green> <gray>It is a world of its own now, sitting under this one in My Experiences. Enter it any time to go back to how things were.</gray>
experience.backup.queued=<yellow>Backup started.</yellow> <gray>The copy is being made. It appears in My Experiences on its own the moment it is finished.</gray>
experience.backup.busy=<yellow>Somebody still has this world open.</yellow> <gray>This server is set to copy only worlds nobody is in, so nothing was copied. Leave the world, give it a moment, and ask again.</gray>
experience.backup.limit=<red>This world cannot be backed up again.</red> <gray>An experience keeps at most <white><max></white> backups, and a backup is never copied itself. Delete one to make room — nothing is ever thrown away for you.</gray>
experience.backup.failed=<red>The copy could not be finished.</red> <gray>Your world was not touched, and no half-finished copy was left behind. If people are playing in it right now it may not sit still long enough to be copied — try again when it is quieter.</gray>
experience.backup.not-owner=<red>You do not own that experience.</red>
experience.backup.nospace=<red>There is no room on the server for another copy.</red> <gray>Your world was not touched and nothing half-finished was left behind. Delete a backup you no longer need, or ask an admin, and try again.</gray>
experience.restore.working=<yellow>Putting this copy back in place…</yellow> <gray>Asking the server that holds both worlds. Nothing is being copied, so this is quick.</gray>
experience.restore.done=<green>Restored.</green> <gray>This copy is your world again, exactly as it was when you took it. The world you were just playing was kept as a copy called "(before restore)", so you can change your mind.</gray>
experience.restore.queued=<yellow>Restore started.</yellow> <gray>The server holding the world has not answered yet. The request stands and it runs the moment that server reads it.</gray>
experience.restore.busy=<yellow>Somebody still has one of these worlds open.</yellow> <gray>Nothing was changed. Both the world and the copy have to be empty, so leave, give it a moment, and ask again.</gray>
experience.restore.gone=<red>There is nothing to restore this over.</red> <gray>The world this copy was taken from has been deleted, so the copy is now a world of its own. Enter it, or make a duplicate of it.</gray>
experience.restore.failed=<red>The restore could not be finished.</red> <gray>Nothing was changed — your world and your copy are both exactly as they were. Try again in a moment.</gray>
experience.restore.not-owner=<red>You do not own that copy.</red>
experience.refresh.working=<yellow>Taking this copy again…</yellow> <gray>The whole world is copied from scratch, so a big map can take a while — you do not have to wait here.</gray>
experience.refresh.done=<green>Copy updated.</green> <gray>It now holds the world exactly as it is right now. The version it held before is gone.</gray>
experience.refresh.queued=<yellow>Update started.</yellow> <gray>The copy is being taken again. It is finished on its own, and nothing else changes in the meantime.</gray>
experience.refresh.busy=<yellow>Somebody still has this copy open.</yellow> <gray>The copy is replaced by this, and a world somebody is standing in is never removed — so nothing was changed. Leave it, give it a moment, and ask again.</gray>
experience.refresh.gone=<red>There is nothing left to copy from.</red> <gray>The world this copy was taken from has been deleted, so there is no newer version of it to take. What you have is all there is.</gray>
experience.refresh.failed=<red>The copy could not be finished.</red> <gray>Your old copy is untouched and no half-finished one was left behind. If people are playing in the world right now it may not sit still long enough to be copied — try again when it is quieter.</gray>
experience.refresh.not-owner=<red>You do not own that copy.</red>
experience.duplicate.working=<yellow>Making a world out of this copy…</yellow> <gray>The whole thing is copied, so a big map can take a moment.</gray>
experience.duplicate.done=<green>Duplicate created.</green> <gray>It is a world of its own now — nobody's copy. Deleting the original changes nothing about it, and it uses one of your world slots.</gray>
experience.duplicate.queued=<yellow>Duplicate started.</yellow> <gray>The copy is being made. It appears in My Experiences on its own the moment it is finished.</gray>
experience.duplicate.busy=<yellow>Somebody still has this world open.</yellow> <gray>This server is set to copy only worlds nobody is in, so nothing was copied. Leave the world, give it a moment, and ask again.</gray>
experience.duplicate.limit=<red>You have no room for another world.</red> <gray>You can own <white><max></white> worlds at once, and a duplicate is a world and not a copy. Delete one you have finished with to make room.</gray>
experience.duplicate.failed=<red>The duplicate could not be finished.</red> <gray>Nothing was left half-made and the world it came from was not touched. If people are playing in it right now it may not sit still long enough to be copied — try again when it is quieter.</gray>
experience.duplicate.not-owner=<red>You do not own that experience.</red>
experience.hardcore.lost=<dark_red><bold>HARDCORE</bold></dark_red> <red>You died. This world is over.</red> <gray>You can still look around it as a spectator, but it can never be played again — deleting it is all that is left.</gray>
experience.hardcore.on=<dark_red><bold>HARDCORE</bold></dark_red> <red>This world is hardcore now — one death ends it for everyone.</red> <gray>The hardcore hearts appear the next time you enter it.</gray>
experience.hardcore.off=<green><bold>HARDCORE OFF</bold></green> <gray>Deaths in this world are survivable again.</gray>
experience.hardcore.spectating=<dark_red><bold>HARDCORE</bold></dark_red> <gray>This world was lost. You are a spectator here.</gray>
experience.reset.starting=<dark_red><bold>DEATH RESETS</bold></dark_red> <red><player> died.</red> <gray>A new world is being prepared — hold on.</gray>
experience.reset.countdown-number=<red><bold><value></bold></red>
experience.reset.slow=<yellow>The new world is taking a moment longer than usual.</yellow> <gray>Hold on — nothing is lost.</gray>
experience.reset.done=<green><bold>NEW WORLD</bold></green> <gray>Reset <resets> — everyone starts again from nothing. Good luck.</gray>
experience.reset.failed=<red><bold>RESET FAILED</bold></red> <gray>The new world could not be prepared, so nothing was changed — you are still in the world you were already in.</gray>
experience.reset.busy=<yellow>This experience is regenerating its world right now.</yellow> <gray>Try again in a moment.</gray>
experience.limit-reached=<red>You have reached the limit of</red> <white><max></white> <red>experience worlds.</red> <gray>Delete one with</gray> <white>/sx experience delete <id></white> <gray>to make room.</gray>
