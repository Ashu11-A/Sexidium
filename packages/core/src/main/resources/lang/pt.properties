experience.refresh.queued=<yellow>Atualização iniciada.</yellow> <gray>A cópia está sendo refeita. Ela termina sozinha, e nada mais muda enquanto isso.</gray>
experience.refresh.busy=<yellow>Alguém ainda está com esta cópia aberta.</yellow> <gray>A cópia é substituída por esta ação, e um mundo em que alguém está nunca é removido — então nada foi mudado. Saia dela, espere um instante e peça de novo.</gray>
experience.refresh.gone=<red>Não sobrou de onde copiar.</red> <gray>O mundo de onde esta cópia veio foi apagado, então não existe versão mais nova para pegar. O que você tem é tudo o que há.</gray>
experience.refresh.failed=<red>Não foi possível terminar a cópia.</red> <gray>Sua cópia antiga está intacta e nenhuma pela metade ficou para trás. Se tem gente jogando no mundo agora, ele pode não ficar parado o bastante para ser copiado — tente de novo num momento mais calmo.</gray>
experience.refresh.not-owner=<red>Você não é dono dessa cópia.</red>
experience.duplicate.working=<yellow>Transformando esta cópia em um mundo…</yellow> <gray>Tudo é copiado, então um mapa grande pode demorar um pouco.</gray>
experience.duplicate.done=<green>Duplicata criada.</green> <gray>Agora ela é um mundo próprio — cópia de ninguém. Apagar o original não muda nada nela, e ela ocupa uma das suas vagas de mundo.</gray>
experience.duplicate.queued=<yellow>Duplicata iniciada.</yellow> <gray>A cópia está sendo feita. Ela aparece sozinha em Minhas Experiências assim que terminar.</gray>
experience.duplicate.busy=<yellow>Alguém ainda está com este mundo aberto.</yellow> <gray>Este servidor está configurado para copiar só mundos vazios, então nada foi copiado. Saia do mundo, espere um instante e peça de novo.</gray>
experience.duplicate.limit=<red>Você não tem vaga para mais um mundo.</red> <gray>Você pode ter <white><max></white> mundos ao mesmo tempo, e uma duplicata é um mundo, não uma cópia. Apague um que você já terminou para abrir espaço.</gray>
experience.duplicate.failed=<red>Não foi possível terminar a duplicata.</red> <gray>Nada ficou pela metade e o mundo de origem não foi mexido. Se tem gente jogando nele agora, ele pode não ficar parado o bastante para ser copiado — tente de novo num momento mais calmo.</gray>
experience.duplicate.not-owner=<red>Você não é dono dessa experiência.</red>
