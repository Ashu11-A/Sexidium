experience.backup.not-owner=<red>Você não é dono dessa experiência.</red>
experience.backup.nospace=<red>Não há espaço no servidor para mais uma cópia.</red> <gray>Seu mundo não foi mexido e nada ficou pela metade. Apague um backup que você não usa mais, ou fale com um admin, e tente de novo.</gray>
experience.restore.working=<yellow>Colocando esta cópia de volta no lugar…</yellow> <gray>Falando com o servidor que guarda os dois mundos. Nada está sendo copiado, então isso é rápido.</gray>
experience.restore.done=<green>Restaurado.</green> <gray>Esta cópia voltou a ser o seu mundo, do jeitinho que estava quando você a fez. O mundo em que você estava jogando foi guardado como uma cópia chamada "(before restore)", caso você mude de ideia.</gray>
experience.restore.queued=<yellow>Restauração iniciada.</yellow> <gray>O servidor que guarda o mundo ainda não respondeu. O pedido continua de pé e ele executa assim que ler.</gray>
experience.restore.busy=<yellow>Alguém ainda está com um destes mundos aberto.</yellow> <gray>Nada foi mudado. Tanto o mundo quanto a cópia precisam estar vazios, então saia, espere um instante e peça de novo.</gray>
experience.restore.gone=<red>Não há sobre o que restaurar isto.</red> <gray>O mundo de onde esta cópia veio foi apagado, então ela virou um mundo próprio. Entre nela, ou faça uma duplicata.</gray>
