experience.backup.working=<yellow>Fazendo uma cópia deste mundo…</yellow> <gray>Falando com o servidor que o guarda. Um mapa grande pode demorar um pouco — você não precisa ficar esperando aqui.</gray>
experience.backup.done=<green>Backup criado.</green> <gray>Agora ele é um mundo próprio, logo abaixo deste em Minhas Experiências. Entre nele quando quiser para voltar a como as coisas estavam.</gray>
